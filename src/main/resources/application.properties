# Consent Grants service configuration

# --- Persistence (H2) ---
# File-based by default so that in-flight revocation work survives a restart.
# Tests override these with isolated temporary directories / in-memory databases.
spring.datasource.url=jdbc:h2:file:./data/consentgrants;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# --- Scope definition evolution ---
# Resource location of the canonical scope-definition document (versioned).
consent.scope-definition.location=classpath:scope-definitions.json

# --- Consent cache ---
# TTL in milliseconds for cached effective-consent views; 0 disables caching.
consent.cache.ttl-ms=60000
consent.cache.enabled=true
# Maximum number of striped locks guarding cache/database interleaving.
consent.cache.lock-stripes=64

# --- Revocation downstream propagation ---
# Enable the background retry worker that converges unfinished propagation.
consent.revocation.propagation-worker-enabled=true
consent.revocation.propagation-interval-ms=200
consent.revocation.propagation-batch-size=100
consent.revocation.propagation-max-attempts=50

# --- Minimal endpoint access control ---
# Shared secret presented by admin callers via X-Admin-Key header.
consent.admin.key=change-me-admin-key
